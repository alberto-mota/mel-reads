<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Mel Reads</title>
<meta name="theme-color" content="#FFF7FB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mel Reads">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF7FB; --ink:#2B1640; --muted:#6E5A86; --pink:#F0428F; --pinkDark:#D6247A; --pinkShadow:#A3175C;
  --line:#F1DCE8; --soft:#F6ECF3; --lav:#F1EAFF; --lavInk:#6A3FD6; --violet:#8B5CF6; --sun:#FFC93C; --mint:#2BC48A; --sky:#4DA8FF;
  --ok:#22B07D; --okBg:#E3F9EF; --okInk:#0E6B47; --warn:#F08A24; --warnBg:#FFF1DE; --warnInk:#8A4A06; --night:#22113A;
  --card-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 14px 30px -14px rgba(120,30,90,.28),0 2px 6px rgba(120,30,90,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100dvh;color:var(--ink);font-family:'Fredoka',ui-rounded,system-ui,sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none;
  background:radial-gradient(900px 520px at -10% -8%,#FFDDEE 0%,rgba(255,221,238,0) 60%),radial-gradient(800px 520px at 115% 4%,#E6DCFF 0%,rgba(230,220,255,0) 58%),radial-gradient(700px 500px at 50% 115%,#FFF0C9 0%,rgba(255,240,201,0) 60%),var(--bg);background-attachment:fixed}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
.screen{min-height:100dvh;max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 18px calc(env(safe-area-inset-bottom) + 18px);display:flex;flex-direction:column;gap:16px}
.screen.enter{animation:enter .32s cubic-bezier(.2,.9,.3,1.2)}
@keyframes enter{from{opacity:0;transform:translateY(14px) scale(.99)}to{opacity:1;transform:none}}
.screen.night{max-width:none;color:#fff;background:radial-gradient(600px 400px at 50% 0%,#5B2E9A 0%,rgba(91,46,154,0) 70%),linear-gradient(180deg,#2A1450,#1A0C30)}
.screen.night > *{max-width:440px;width:100%;margin-left:auto;margin-right:auto}
.reading{font-family:'Andika',ui-rounded,system-ui,sans-serif}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1 1 auto;min-width:0}
.h1{font-size:28px;font-weight:700;line-height:1.12;margin:0;letter-spacing:-.01em}
.h2{font-size:21px;font-weight:700;margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiny{font-size:12px}
.cap{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:#fff;border:0;border-radius:28px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--card-shadow)}
.card.dark{background:linear-gradient(145deg,#3A1D63,#2B1640);color:#fff}
.card.dark .muted,.card.dark .cap{color:#E3D4FF}
.pill{display:flex;align-items:center;gap:6px;background:#fff;border:0;border-radius:999px;padding:8px 13px;font-weight:700;font-size:17px;box-shadow:0 6px 16px -8px rgba(120,30,90,.35)}
.avatar{width:50px;height:50px;border-radius:50%;background:linear-gradient(145deg,#FFE3F0,#EDE2FF);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px #fff,0 8px 18px -8px rgba(120,30,90,.4);flex-shrink:0}
/* 3D buttons */
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;min-height:62px;border-radius:22px;border:0;color:#fff;font-size:21px;font-weight:700;text-decoration:none;padding:0 22px;width:100%;letter-spacing:.01em;
  background:linear-gradient(180deg,#FF66AC 0%,#E8378A 100%);box-shadow:0 6px 0 var(--pinkShadow),0 14px 24px -10px rgba(163,23,92,.55);text-shadow:0 1px 0 rgba(120,0,60,.25);transition:transform .08s,box-shadow .08s}
.btn::after{content:'';position:absolute;left:14px;right:14px;top:6px;height:12px;border-radius:999px;background:rgba(255,255,255,.28);pointer-events:none}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--pinkShadow),0 6px 12px -8px rgba(163,23,92,.5)}
.btn.soft{background:linear-gradient(180deg,#FFFFFF,#FFF1F8);color:var(--pinkDark);text-shadow:none;box-shadow:0 6px 0 #EAC6DA,0 14px 24px -12px rgba(120,30,90,.35)}
.btn.soft:active{box-shadow:0 1px 0 #EAC6DA}
.btn.ghost{background:transparent;color:var(--muted);box-shadow:none;min-height:48px;font-size:17px;font-weight:600;text-shadow:none}
.btn.ghost::after,.btn.soft::after{display:none}
.btn.ok{background:linear-gradient(180deg,#38D79B,#1FAE78);box-shadow:0 6px 0 #127A53,0 14px 24px -10px rgba(18,122,83,.5)}
.btn.ok:active{box-shadow:0 1px 0 #127A53}
.btn.warn{background:linear-gradient(180deg,#FFB35C,#F08A24);box-shadow:0 6px 0 #B9600C,0 14px 24px -10px rgba(185,96,12,.5)}
.glow{animation:glow 2.2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 6px 0 var(--pinkShadow),0 0 0 8px rgba(240,66,143,.16),0 14px 24px -10px rgba(163,23,92,.55)}}
.icon-btn{width:46px;height:46px;border-radius:50%;background:#fff;border:0;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;box-shadow:0 4px 0 #EBD6E3}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #EBD6E3}
.bar{height:18px;background:#F3E6EF;border-radius:999px;overflow:hidden;flex:1;box-shadow:inset 0 2px 3px rgba(120,30,90,.08)}
.bar > i{position:relative;display:block;height:100%;background:linear-gradient(90deg,#FF7AB8,#F0428F);border-radius:999px;transition:width .45s cubic-bezier(.3,1.4,.5,1);min-width:18px}
.bar > i::after{content:'';position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:999px;background:rgba(255,255,255,.45)}
/* hero (daily goal) */
.hero{position:relative;overflow:hidden;border-radius:32px;padding:20px;color:#fff;display:flex;flex-direction:column;gap:16px;background:linear-gradient(140deg,#FF6FB0 0%,#C774F2 55%,#8B7BFF 100%);box-shadow:0 18px 36px -16px rgba(139,92,246,.6)}
.hero::before{content:'';position:absolute;width:220px;height:220px;border-radius:50%;right:-70px;top:-90px;background:rgba(255,255,255,.14)}
.hero::after{content:'';position:absolute;width:140px;height:140px;border-radius:50%;left:-50px;bottom:-70px;background:rgba(255,255,255,.10)}
.hero > *{position:relative;z-index:1}
.hero .cap{color:rgba(255,255,255,.85)}
.hero .goal-n{font-size:30px;font-weight:700;line-height:1.05}
.hero .goal-t{font-size:16px;line-height:1.3;color:rgba(255,255,255,.95)}
.mascot{border:0;background:transparent;padding:0;display:flex;align-items:center;justify-content:center}
.float{animation:float 3.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px) rotate(-3deg)}}
.wiggle{animation:wiggle .6s}
@keyframes wiggle{20%{transform:rotate(-14deg) scale(1.08)}45%{transform:rotate(12deg) scale(1.12)}70%{transform:rotate(-6deg)}}
.hop{animation:hop 1.1s cubic-bezier(.3,1.6,.5,1) infinite}
@keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-14px) rotate(-4deg)}}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center}
.dot{width:34px;height:34px;border-radius:50%;margin:0 auto 4px;display:flex;align-items:center;justify-content:center;background:var(--soft)}
.dot.met{background:linear-gradient(180deg,#FF6FB0,#E8378A)} .dot.today{background:#fff;border:3px dashed var(--pink)} .dot.shield{background:#8CC8FF}
.hero .dot{background:rgba(255,255,255,.22)} .hero .dot.met{background:#fff;box-shadow:0 3px 0 rgba(90,20,90,.25)} .hero .dot.today{background:transparent;border:3px dashed #fff} .hero .week span{color:rgba(255,255,255,.9)!important}
.ringwrap{position:relative;width:118px;height:118px;flex-shrink:0}
.ringwrap svg.ring{position:absolute;inset:0}
.ringwrap .mid{position:absolute;inset:14px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -4px 0 rgba(139,92,246,.12)}
.chip{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:24px;background:rgba(255,255,255,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:var(--card-shadow)}
.badge{width:56px;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:24px;color:#fff;background:linear-gradient(145deg,#FFB35C,#F0428F);box-shadow:0 5px 0 #B5306E;flex-shrink:0}
/* reading targets */
.target{display:flex;justify-content:center;align-items:flex-end;gap:6px;flex-wrap:wrap;padding:10px 0}
.g{display:flex;flex-direction:column;align-items:center;gap:8px}
.g b{font-family:'Andika',sans-serif;font-size:76px;line-height:1;font-weight:700}
.g i{display:block;height:9px;border-radius:999px;background:#C9B6D8;width:14px}
.g.di b{color:var(--pinkDark)} .g.di i{background:var(--pink);width:56px}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.opts.four{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{min-height:108px;border-radius:26px;border:0;background:#fff;display:flex;align-items:center;justify-content:center;font-size:58px;padding:6px;box-shadow:0 7px 0 #EBD6E3,0 16px 24px -16px rgba(120,30,90,.4);transition:transform .08s,box-shadow .08s}
.opt:active{transform:translateY(6px);box-shadow:0 1px 0 #EBD6E3}
.opt.word{font-family:'Andika',sans-serif;font-size:40px;font-weight:700;min-height:88px}
.opt.right{background:#E3F9EF;box-shadow:0 7px 0 var(--mint);animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.opt.wrong{background:#FFF1DE;box-shadow:0 7px 0 #F5B65A;opacity:.55}
.speak{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;border-radius:999px;border:0;background:#F1EAFF;color:var(--lavInk);font-size:17px;font-weight:700;padding:0 22px;margin:0 auto;box-shadow:0 5px 0 #D9CBFF}
.speak:active{transform:translateY(4px);box-shadow:0 1px 0 #D9CBFF}
.speak.big{width:128px;height:128px;border-radius:50%;padding:0;background:linear-gradient(160deg,#F7F1FF,#E6DAFF);box-shadow:0 8px 0 #CDB9FF,0 0 0 10px rgba(139,92,246,.10)}
.speak.big svg{transform:translateX(3px)}
.speaking{animation:speakpulse .9s ease-in-out 2}
@keyframes speakpulse{50%{box-shadow:0 8px 0 #CDB9FF,0 0 0 22px rgba(139,92,246,.05)}}
.slots{display:flex;justify-content:center;gap:10px;min-height:88px}
.slot{min-width:66px;height:84px;border-radius:20px;border:3px dashed #DCC8D8;display:flex;align-items:center;justify-content:center;font-family:'Andika',sans-serif;font-size:48px;font-weight:700;padding:0 8px;background:rgba(255,255,255,.5)}
.slot.full{border:0;background:#fff;box-shadow:0 6px 0 var(--pink);animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.tiles{display:flex;justify-content:center;flex-wrap:wrap;gap:12px}
.tile{min-width:70px;height:70px;border-radius:20px;border:0;background:#fff;box-shadow:0 6px 0 #E4CFDC,0 14px 20px -14px rgba(120,30,90,.4);font-family:'Andika',sans-serif;font-size:40px;font-weight:700;padding:0 12px}
.tile:active{transform:translateY(5px);box-shadow:0 1px 0 #E4CFDC}
.tile.used{visibility:hidden}
.sentence{font-family:'Andika',sans-serif;font-size:34px;line-height:1.5;font-weight:700;text-align:center;display:flex;flex-wrap:wrap;justify-content:center;gap:0 10px}
.sentence span{border-radius:12px;padding:0 3px;transition:background .15s}
.sentence span:active{background:#FFE3F0}
/* bottom feedback sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);border-radius:30px 30px 0 0;display:flex;flex-direction:column;gap:14px;animation:slideUp .32s cubic-bezier(.2,1.2,.4,1);z-index:20}
.sheet.ok{background:#E3F9EF;box-shadow:0 -10px 30px -10px rgba(34,176,125,.35)}
.sheet.bad{background:#FFF1DE;box-shadow:0 -10px 30px -10px rgba(240,138,36,.35)}
.sheet .msg{display:flex;align-items:center;gap:12px;font-weight:700;font-size:21px}
.sheet.ok .msg{color:var(--okInk)} .sheet.bad .msg{color:var(--warnInk)}
.sheet-space{height:150px;flex-shrink:0}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.pop{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.9)}50%{transform:scale(1.1)}100%{transform:none}}
/* bottom nav */
.nav{position:sticky;bottom:calc(env(safe-area-inset-bottom) + 10px);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:auto;padding:6px;border-radius:26px;background:rgba(255,255,255,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 14px 30px -14px rgba(120,30,90,.4);z-index:10}
.nav button{background:transparent;border:0;border-radius:20px;min-height:58px;font-size:13px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;overflow:hidden}
.nav button.on{color:var(--pinkDark);background:#FFE6F2}
.hold-fill{position:absolute;left:0;bottom:0;height:4px;width:0;background:var(--pink)}
.holding .hold-fill{width:100%;transition:width 1.2s linear}
/* path */
.path{display:flex;flex-direction:column;align-items:center;gap:16px;padding:6px 0 10px}
.node{position:relative;width:68px;height:68px;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;background:#EEE3EB;box-shadow:0 7px 0 #D8C7D3;padding:0}
.node.done{background:linear-gradient(180deg,#FF6FB0,#E8378A);box-shadow:0 7px 0 var(--pinkShadow)}
.node.cur{width:88px;height:88px;background:#fff;box-shadow:0 7px 0 var(--pinkShadow),0 0 0 6px var(--pink)}
.node.cur::before{content:'';position:absolute;inset:-14px;border-radius:50%;border:4px solid rgba(240,66,143,.35);animation:ring 1.8s ease-out infinite}
@keyframes ring{from{transform:scale(.85);opacity:1}to{transform:scale(1.25);opacity:0}}
.node.chest{border-radius:24px;background:linear-gradient(180deg,#FFE58A,#FFC93C);box-shadow:0 7px 0 #D99A12}
.node.chest.done{background:linear-gradient(180deg,#C8F5DF,#7FE0B4);box-shadow:0 7px 0 #22B07D}
.node:active:not(:disabled){transform:translateY(5px)}
.bubble{background:#fff;color:var(--pinkDark);font-weight:700;font-size:14px;border-radius:14px;padding:6px 14px;box-shadow:0 4px 0 #EBD6E3;animation:float 2.4s ease-in-out infinite}
.unit{border-radius:26px;padding:16px 18px;display:flex;align-items:center;gap:12px;color:#fff;box-shadow:0 14px 26px -16px rgba(80,30,120,.6)}
.unit .cap{color:rgba(255,255,255,.85)}
.unit.u1{background:linear-gradient(135deg,#3FD39B,#4DA8FF)} .unit.u2{background:linear-gradient(135deg,#FF6FB0,#B57BFF)} .unit.u3{background:linear-gradient(135deg,#8B7BFF,#58C3FF)}
.unit.locked{filter:saturate(.35) brightness(1.08)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg button{min-height:58px;border-radius:16px;border:0;background:#fff;font-size:15px;font-weight:700;box-shadow:0 4px 0 #EBD6E3}
.seg button.on{background:#FFE6F2;box-shadow:0 4px 0 var(--pink);color:var(--pinkDark)}
.skill{display:flex;flex-direction:column;gap:4px}
.skill .bar{height:10px;flex:none}
.skill .bar > i{min-width:0} .skill .bar > i::after{display:none}
.strip{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px}
.strip i{height:22px;border-radius:7px;background:#F0E1EA;display:block}
.strip i.met{background:var(--pink)} .strip i.extra{background:var(--pinkShadow)} .strip i.shield{background:#8CC8FF}
input[type=time],input[type=date],textarea{font-family:inherit;font-size:16px;border:0;border-radius:14px;padding:9px 11px;color:var(--ink);background:#F7EFF5;-webkit-user-select:text;user-select:text}
textarea{width:100%;min-height:90px;resize:vertical}
.list-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #F3E9EF}
.list-row:last-child{border-bottom:0}
.faces{display:flex;gap:14px;justify-content:center}
.faces button{width:86px;height:86px;border-radius:50%;border:0;background:#fff;padding:0;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 #EBD6E3;transition:transform .1s}
.faces button:active{transform:translateY(4px) scale(.96)}
.faces button.on{box-shadow:0 6px 0 var(--pink),0 0 0 4px #FFE6F2;transform:scale(1.06)}
.center{text-align:center;align-items:center}
.spacer{flex:1}
/* effects */
.spark{position:fixed;z-index:60;pointer-events:none;font-style:normal;transform:translate(-50%,-50%);animation:spark .85s cubic-bezier(.2,.8,.3,1) forwards;text-shadow:0 1px 0 rgba(0,0,0,.08)}
@keyframes spark{to{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(var(--r)) scale(.3);opacity:0}}
.confetti{position:fixed;top:-24px;z-index:60;pointer-events:none;animation-name:fall;animation-timing-function:cubic-bezier(.3,.6,.5,1);animation-fill-mode:forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(760deg)}}
.draw path{stroke-dasharray:120;stroke-dashoffset:120;animation:draw .9s ease-out forwards}
.draw path:nth-child(2){animation-delay:.15s} .draw path:nth-child(3){animation-delay:.3s} .draw path:nth-child(4){animation-delay:.45s}
@keyframes draw{to{stroke-dashoffset:0}}
.toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 96px);margin:0 auto;max-width:420px;z-index:70;background:#2B1640;color:#fff;border-radius:18px;padding:14px 16px;font-size:16px;font-weight:600;text-align:center;animation:slideUp .3s ease-out;box-shadow:0 14px 30px -10px rgba(0,0,0,.4)}
/* ===== v0.3: Sparkle everywhere, garden, books, wardrobe ===== */
.sp{border:0;background:transparent;padding:0;display:block;flex-shrink:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.sp svg{width:100%;height:auto;display:block;overflow:visible}
.m-talk{display:none} body.talking .m-talk{display:inline;animation:talk .26s steps(2,end) infinite;transform-box:fill-box;transform-origin:50% 0} body.talking .m-rest{display:none}
@keyframes talk{0%{transform:scaleY(1)}50%{transform:scaleY(.35)}}
body.talking .sp svg{animation:nod 1.2s ease-in-out infinite} @keyframes nod{50%{transform:rotate(-2deg) translateY(-2px)}}
.float-sp svg{animation:float 3.4s ease-in-out infinite} .hop-sp svg{animation:hop 1.2s cubic-bezier(.3,1.6,.5,1) infinite}
.sp.wiggle svg{animation:wiggle .6s}
.sp-row{display:flex;align-items:center;gap:10px;min-height:96px}
.say-bubble{position:relative;background:#fff;border-radius:22px;padding:12px 16px;font-size:18px;font-weight:600;line-height:1.3;box-shadow:var(--card-shadow);flex:1;min-width:0}
.sp-row .say-bubble::before{content:'';position:absolute;left:-9px;top:50%;margin-top:-9px;border:9px solid transparent;border-right-color:#fff;border-left:0}
.say-bubble.big{font-size:20px;text-align:center}
.hero-sp{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:-6px}
.hero-sp .say-bubble{max-width:340px}
.hero-sp .say-bubble::before{content:'';position:absolute;top:-9px;left:50%;margin-left:-9px;border:9px solid transparent;border-bottom-color:#fff;border-top:0}
.screen.dusk{background:linear-gradient(180deg,#E9DDFF 0%,#FFE6F2 60%,rgba(255,247,251,0) 100%)}
.topbar{gap:8px} .gear{width:44px;height:44px;position:relative;overflow:hidden}
.adventure{gap:14px} .steps4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.step4{display:flex;flex-direction:column;align-items:center;gap:2px;background:#FFF4FA;border-radius:16px;padding:8px 2px;font-size:12px;color:var(--muted)} .step4 span{font-size:26px} .step4.done{background:#E3F9EF}
.more-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px} .more-grid .btn{font-size:16px;min-height:56px;padding:0 8px}
.garden-chip{width:100%;box-sizing:border-box} .mini-garden{display:flex;margin:-4px 0;flex-shrink:0;max-width:150px;overflow:hidden} .mini-garden svg{margin-right:-12px}
