# Records Sparkle's voice clips whenever the things she says change, and commits them to the same branch.
name: Sparkle's voice
on:
  workflow_dispatch:
  push:
    paths: ['src/content.js', 'src/math.js', 'tools/voice/**', '.github/workflows/voice.yml']
permissions:
  contents: write
concurrency:
  group: voice-${{ github.ref }}
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: tools/voice/requirements.txt }
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: kokoro-v1 }
      - run: sudo apt-get update -q && sudo apt-get install -yq espeak-ng ffmpeg
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r tools/voice/requirements.txt
      - run: node tools/voice/texts.mjs > "$RUNNER_TEMP/texts.json"
      - run: python tools/voice/generate.py "$RUNNER_TEMP/texts.json"
        env: { SAMPLES: '1' }
      - name: Commit new clips
        run: |
          git add src/voice
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Record Sparkle's voice clips"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
